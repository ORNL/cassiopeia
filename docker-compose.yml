services:

  # ── API server ──────────────────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      DB_PATH: /app/data/cassiopeia.db
      RAG_PERSIST_DIR: /app/data/chroma_db
      CASSIOPEIA_SETTINGS_DB: /app/data/user_settings.db
      DISABLE_SSL_VERIFY: "true"
    volumes:
      - cassiopeia_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Chainlit chat interface (disabled) ────────────────────────────────────
  # chat:
  #   build: .
  #   command: chainlit run chainlit_app.py --host 0.0.0.0 --port 8001 --headless
  #   ports:
  #     - "${CHAINLIT_PORT:-8001}:8001"
  #   env_file: .env
  #   environment:
  #     DB_PATH: /app/data/cassiopeia.db
  #     RAG_PERSIST_DIR: /app/data/chroma_db
  #     DISABLE_SSL_VERIFY: "true"
  #     API_BASE_URL: http://api:8000
  #     CHAINLIT_URL: http://localhost:${CHAINLIT_PORT:-8001}
  #     DASHBOARD_URL: http://localhost:5173
  #   volumes:
  #     - cassiopeia_data:/app/data
  #     - chainlit_files:/app/.files
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   restart: unless-stopped

  # ── React dashboard ─────────────────────────────────────────────────────────
  dashboard:
    build:
      context: frontend
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  cassiopeia_data:   # SQLite DB + ChromaDB
  # chainlit_files:  # Chainlit uploaded-file storage (disabled)
